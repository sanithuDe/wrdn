services:
  backend:
    build:
      context: .
      dockerfile: wrdn/backend/Dockerfile

    container_name: wrdn-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    command: >
      python -m uvicorn wrdn.backend.main:app
      --host 0.0.0.0
      --port 8000

    volumes:
      - wrdn_database:/app/wrdn/backend/data

    restart: unless-stopped

  frontend:
    build:
      context: ./wrdn/frontend
      dockerfile: Dockerfile

    container_name: wrdn-frontend

    ports:
      - "8085:3000"

    environment:
      INTERNAL_API_URL: http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  wrdn_database: